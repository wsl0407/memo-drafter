<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工務備忘錄擬稿</title>
</head>
<body>

<style>
/* Layout: 左側填寫欄位，右側即時預覽一張備忘錄；手機寬度時上下堆疊 */
:root{
  --bg:#f3f4f1; --panel:#ffffff; --ink:#1e2622; --muted:#5f6b65; --line:#d5dad5;
  --accent:#1f5f4a; --accent-ink:#ffffff; --accent-soft:#e3eee9; --paper:#ffffff; --paper-ink:#111;
  --warn:#8a5a00; --warn-soft:#fbf1dc;
  --ui:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
  --kai:"DFKai-SB","BiauKai","標楷體","Kaiti TC","KaiTi","Noto Serif TC",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151a18; --panel:#1d2421; --ink:#e6ebe8; --muted:#9aa8a1; --line:#33403a;
  --accent:#6cc3a2; --accent-ink:#0f1a15; --accent-soft:#22332c; --paper:#f7f7f4; --paper-ink:#111;
  --warn:#f0c46a; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151a18; --panel:#1d2421; --ink:#e6ebe8; --muted:#9aa8a1; --line:#33403a;
  --accent:#6cc3a2; --accent-ink:#0f1a15; --accent-soft:#22332c; --paper:#f7f7f4; --paper-ink:#111;
  --warn:#f0c46a; --warn-soft:#3a2f17; color-scheme:dark}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 20px;margin-bottom:16px}
h1{font-family:"Noto Serif TC",serif;font-size:1.5rem;margin:0;letter-spacing:.08em}
header p{margin:0;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:18px;min-width:0}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-weight:700;font-size:.8rem;letter-spacing:.12em;color:var(--muted);margin-bottom:6px;padding:0}
.types{display:flex;flex-wrap:wrap;gap:6px}
.types button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.types button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:.9rem}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;min-width:0;width:100%;box-sizing:border-box}
input[type=checkbox]{width:auto}
textarea{resize:vertical;line-height:1.6}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.docno{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink);background:var(--accent-soft);border-radius:7px;padding:7px 9px}
.unit{display:flex;flex-direction:column;gap:4px;min-width:0}
.unit>label{font-size:.82rem;color:var(--muted)}
.pick,.addrow{display:flex;gap:6px;min-width:0}
.pick select,.addrow input{flex:1 1 auto;min-width:0}
.btn.sm{padding:6px 10px;font-size:.85rem;white-space:nowrap;flex:none}
.btn.primary2{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select{appearance:auto}
.cat{font-size:1.05rem;font-weight:700;padding:10px 12px;border:2px solid var(--accent);background:var(--accent-soft)}
#params .wide{grid-column:1 / -1}
.segWrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.segLabel{font-size:.82rem;color:var(--muted);min-width:4.5em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;background:var(--bg)}
.seg button{font:inherit;font-size:.92rem;border:0;background:transparent;color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
#params .sub{grid-column:1 / -1;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.edited{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--warn-soft);color:var(--warn);
  border-radius:7px;padding:7px 10px;font-size:.85rem}
.btn{font:inherit;cursor:pointer;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700;padding:11px 18px;font-size:1rem}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#status{font-size:.88rem;color:var(--muted)}
/* 預覽紙張 */
.previewBox{position:sticky;top:12px;min-width:0}
.previewBox .cap{font-size:.8rem;color:var(--muted);margin:0 0 8px;letter-spacing:.06em}
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--kai);border:1px solid var(--line);border-radius:4px;
  padding:26px 28px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.paper .t1{text-align:center;font-size:1.25em;letter-spacing:.05em}
.paper .t2{text-align:center;font-size:1em}
.paper .t3{text-align:center;font-size:1.3em;font-weight:700;letter-spacing:.4em;margin-bottom:10px}
.paper .kv{display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:2px 4px}
.paper .kv .k{white-space:nowrap}
.paper .box{border:1px solid #222;margin-top:10px;padding:8px 10px}
.paper .subj{display:grid;grid-template-columns:3em minmax(0,1fr)}
.paper ol{margin:4px 0 0;padding:0;list-style:none}
.paper li{display:grid;grid-template-columns:2.4em minmax(0,1fr)}
.paper li.sub{padding-left:2.4em;grid-template-columns:2.8em minmax(0,1fr)}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;border:1px solid #222;border-top:0;text-align:center}
.paper .sign div+div{border-left:1px solid #222}
.paper .sign div{padding:2px 0 28px}
@media (prefers-reduced-motion:no-preference){.types button{transition:background .15s}}
</style>

<div class="wrap">
  <header>
    <h1>工務備忘錄擬稿</h1>
    <p>豐譽營造・衛生福利部防疫中心興建工程　｜　填好欄位 → 下載 Word（擬稿／正本／副本三聯）</p>
  </header>

  <div class="grid">
    <form class="panel" id="form" autocomplete="off">

      <fieldset class="catSet">
        <legend>提送類別</legend>
        <select id="cat" class="cat"></select>
      </fieldset>

      <fieldset id="paramsSet">
        <legend>本次內容</legend>
        <div class="row" id="params"></div>
      </fieldset>

      <fieldset>
        <legend>發文資訊</legend>
        <div class="row">
          <label>發文日期<input type="date" id="date"></label>
          <label>當日流水號<input type="number" id="seq" min="1" max="99" value="1"></label>
        </div>
        <div class="unit">
          <label for="handler">承辦人</label>
          <div class="pick">
            <select id="handler"></select>
            <button type="button" class="btn sm" id="hAdd">＋新增</button>
            <button type="button" class="btn sm" id="hDel">移除</button>
          </div>
          <div class="addrow" id="hAddRow" hidden>
            <input id="hNew" placeholder="輸入人員姓名">
            <button type="button" class="btn sm primary2" id="hSave">加入</button>
            <button type="button" class="btn sm" id="hCancel">取消</button>
          </div>
          <p class="hint" id="hMsg" role="status"></p>
        </div>
        <div><span class="hint">文號</span><div class="docno" id="docno"></div></div>
        <label>工程編號<input id="code" list="codes" value="109-C303-0106-9109-211-0"></label>
        <datalist id="codes"><option value="109-C303-0106-9109-211-0"><option value="109-C303-0106-9109-281-0"></datalist>
        <div class="unit">
          <label for="mainTo">正本</label>
          <div class="pick">
            <select id="mainTo"></select>
            <button type="button" class="btn sm" data-add="mainTo">＋新增</button>
            <button type="button" class="btn sm" data-del="mainTo">移除</button>
          </div>
          <div class="addrow" id="add_mainTo" hidden>
            <input id="new_mainTo" placeholder="輸入單位全名">
            <button type="button" class="btn sm primary2" data-save="mainTo">加入</button>
            <button type="button" class="btn sm" data-cancel="mainTo">取消</button>
          </div>
        </div>
        <div class="unit">
          <label for="ccTo">副本</label>
          <div class="pick">
            <select id="ccTo"></select>
            <button type="button" class="btn sm" data-add="ccTo">＋新增</button>
            <button type="button" class="btn sm" data-del="ccTo">移除</button>
          </div>
          <div class="addrow" id="add_ccTo" hidden>
            <input id="new_ccTo" placeholder="輸入單位全名">
            <button type="button" class="btn sm primary2" data-save="ccTo">加入</button>
            <button type="button" class="btn sm" data-cancel="ccTo">取消</button>
          </div>
        </div>
        <p class="hint" id="unitMsg" role="status"></p>
      </fieldset>

      <fieldset>
        <legend>主旨與說明</legend>
        <div class="edited" id="editedBar" hidden>
          <span>主旨／說明已手動修改，上方「本次內容」變更不會再覆蓋。</span>
          <button type="button" class="btn sm" id="regen">依類別重新產生</button>
        </div>
        <label>主旨（「主旨：」之後的文字；工程編號改了會自動同步）<textarea id="subject" rows="3"></textarea></label>
        <label>說明（一行一項，自動編號 一、二、…；行首加「-」為子項 (一)(二)…）<textarea id="items" rows="7" placeholder="例：提送115年10月14日捷運及基地監測工程周報表一式一份。"></textarea></label>
      </fieldset>

      <fieldset>
        <legend>輸出</legend>
        <label>檔名<input id="fname"></label>
        <div class="actions">
          <button type="submit" class="btn primary" id="dl">下載 Word 檔</button>
          <span id="status" role="status"></span>
        </div>
      </fieldset>
    </form>

    <div class="previewBox">
      <p class="cap">預覽（擬稿聯；下載檔內含擬稿、正本、副本三聯，格式同原稿）</p>
      <div class="paper" id="paper"></div>
    </div>
  </div>
</div>

<script>
/* 備忘錄擬稿核心：範本文字產生 + document.xml 填寫 */
var MemoCore = (function () {
  var ZH = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  function zhNum(n) {
    n = parseInt(n, 10);
    if (!(n >= 0)) return '';
    if (n < 10) return ZH[n];
    if (n < 20) return '十' + (n % 10 ? ZH[n % 10] : '');
    if (n < 100) return ZH[Math.floor(n / 10)] + '十' + (n % 10 ? ZH[n % 10] : '');
    return String(n);
  }
  function pad2(n) { n = String(parseInt(n, 10)); return n.length < 2 ? '0' + n : n; }
  function int(n) { return String(parseInt(n, 10)); }

  var PROJECT = '衛生福利部防疫中心興建工程';
  var CODE_MAIN = '109-C303-0106-9109-211-0';
  var CODE_TEST = '109-C303-0106-9109-281-0';
  var SAFE = '，相關觀測數據成果均在安全管理值內，顯示現階段觀測數值尚屬穩定安全，無異常情形。';

  function head(code) { return '檢送「' + PROJECT + '」(工程編號：' + code + ')'; }

  var CONTRACT = '依工程契約「洽辦機關、國土管理署、各區都市基礎工程分署、技術服務廠商與施工廠商之權責區分表」四、5施工廠商之分項施工計畫書、施工設備、替代之施工方法、施工場所配置辦理。';

  function isRevise(v) { return /^修正/.test(v); }
  function isFinal(v) { return /^審定/.test(v || ''); }
  function verSuffix(v) { return (v && v !== '一般提送') ? '(' + v + ')' : ''; }
  function fmtDate(d) { return d.y + '年' + pad2(d.m) + '月' + pad2(d.d) + '日'; }
  /* 來文：復 劉培森建築師事務所115年08月18日森(工)字第1150818001號工地備忘錄辦理。 */
  function replyLine(p) {
    return '復 ' + (p.rUnit || '') + (p.rDate ? fmtDate(p.rDate) : '') + (p.rNo || '○○字第○○號') + (p.rKind || '') + '辦理。';
  }
  var REPLY_FIELDS = [
    { id: 'rUnit', label: '來文單位', kind: 'select', options: ['劉培森建築師事務所', '貴分署'], def: '劉培森建築師事務所', show: 'reply' },
    { id: 'rDate', label: '來文日期', kind: 'rocdate', show: 'reply' },
    { id: 'rNo', label: '來文字號', kind: 'text', def: '', ph: '例：森(工)字第1150818001號', show: 'reply' },
    { id: 'rKind', label: '來文文別', kind: 'text', def: '工地備忘錄', show: 'reply' }
  ];
  var MODEL_BASIS = 'UN023字第1140020127號';  /* 模型送審第一版固定依據 */
  var VERS_SUBMIT = ['第一版', '修正一版', '審定版', '增修', '審定'];
  var VERS_N = []; for (var vi = 1; vi <= 30; vi++) VERS_N.push(zhNum(vi) + '版');
  /* 「增修」「審定」＋第幾版 → 增修一版、審定一版… */
  function fullVer(p) { return (p.ver === '增修' || p.ver === '審定') ? p.ver + (p.verN || '一版') : p.ver; }
  var VERS_MON = ['一般提送', '修正一版', '修正二版', '審定版'];

  /* 類別：fields 為需要輸入的參數（show: 'reply' 表示有來文時才顯示）；build 回傳 {subject, items, title} */
  var TYPES = {
    monitor: {
      name: 'A. 監測相關－月報、周報',
      code: CODE_MAIN,
      fields: [
        { id: 'target', label: '監測對象', kind: 'seg', options: ['捷運及基地監測', '歷史建築監測'], def: '捷運及基地監測' },
        { id: 'period', label: '報表週期', kind: 'seg', options: ['周報', '月報'], def: '周報' },
        { id: 'rdate', label: '周報表日期', kind: 'rocdate', def: 'lastTuesday', show: 'weekly' },
        { id: 'ym', label: '月報表月份', kind: 'rocmonth', show: 'monthly' },
        { id: 'initial', label: '說明加註「基地監測初始值及」', kind: 'check', def: false, show: 'base' },
        { id: 'ver', label: '版次', kind: 'select', options: VERS_MON, def: '一般提送' },
        { id: 'copies', label: '份數', kind: 'number', def: 'byVer' },
        { id: 'ref', label: '審定依據字號', kind: 'text', def: '', ph: '例：國北都八字第1151031960號', show: 'final' }
      ].concat(REPLY_FIELDS),
      showIf: function (p, key) {
        var weekly = p.period === '周報';
        return { weekly: weekly, monthly: !weekly, base: p.target === '捷運及基地監測' && !weekly && !isRevise(p.ver),
                 final: isFinal(p.ver), reply: isRevise(p.ver) }[key];
      },
      build: function (p) {
        var S, S2, basis, end, mrt = p.target === '捷運及基地監測', weekly = p.period === '周報';
        var name = mrt ? (weekly ? '捷運及基地監測工程周報表' : '基地監測工程月報表')
                       : (weekly ? '歷史建築監測工程周報表' : '歷史建築監測工程月報表');
        if (weekly) {
          S = S2 = p.rdate.y + '年' + int(p.rdate.m) + '月' + int(p.rdate.d) + '日' + name;
          end = '請 鑒查。';
        } else {
          S = p.ym.y + '年' + int(p.ym.m) + '月' + name;
          S2 = mrt ? S : p.ym.y + '年' + pad2(p.ym.m) + '月' + name;
          end = mrt ? '請 鑒核存查。' : '請 鑒核。';
        }
        basis = mrt ? (weekly ? '' : '依安全監測工程施工分項計畫辦理，') : '依歷史建築觀測保護分項計畫辦理，';
        var sx = verSuffix(p.ver), items, subject;
        if (isRevise(p.ver)) {
          subject = head(p.code) + ' 之' + S + sx + '，惠請 鑒核。';
          items = [replyLine(p)];
        } else {
          subject = head(p.code) + ' 之' + S + sx + '提送，' + (isFinal(p.ver) ? '請 鑒核。' : end);
          var init = (p.initial && mrt && !weekly) ? '基地監測初始值及' : '';
          items = [(isFinal(p.ver) ? '依' + (p.ref || '○○字第○○號') + '辦理，' : basis) + '提送' + init + S2 + sx + SAFE];
        }
        items.push('檢送' + S2 + sx + '一式' + zhNum(p.copies) + '份。');
        return { subject: subject, items: items, title: S + sx };
      }
    },
    material: {
      name: 'B. 材料暨廠商資格送審',
      code: CODE_MAIN,
      fields: [
        { id: 'mat', label: '材料名稱', kind: 'text', def: '', ph: '例：預拌混凝土' },
        { id: 'vendor', label: '廠商名稱', kind: 'text', def: '', ph: '例：宥辰興業股份有限公司' },
        { id: 'ver', label: '版次', kind: 'select', options: VERS_SUBMIT, def: '第一版' },
        { id: 'verN', label: '第幾版', kind: 'select', options: VERS_N, def: '一版', show: 'verN' },
        { id: 'copies', label: '份數', kind: 'number', def: 'byVer' }
      ].concat(REPLY_FIELDS),
      showIf: function (p, key) { return key === 'reply' ? p.ver !== '第一版' : true; },
      build: function (p) {
        var mat = p.mat || '○○'; var S = mat + '材料暨廠商資格' + (p.vendor ? ' ' + p.vendor : '') + verSuffix(p.ver);
        var items = (p.ver !== '第一版' ? [replyLine(p)] : []).concat([CONTRACT, '檢送' + S + '一式' + zhNum(p.copies) + '份。']);
        return { subject: head(p.code) + ' 之' + S + '，請 鑒核。', items: items,
                 title: (mat + '材料暨廠商資格' + (p.vendor ? '-' + p.vendor : '') + verSuffix(p.ver)) };
      }
    },
    plan: {
      name: 'C. 計畫書送審',
      code: CODE_MAIN,
      fields: [
        { id: 'plan', label: '計畫名稱', kind: 'text', def: '', ph: '例：塔式吊車工程施工計畫' },
        { id: 'ver', label: '版次', kind: 'select', options: VERS_SUBMIT, def: '第一版' },
        { id: 'verN', label: '第幾版', kind: 'select', options: VERS_N, def: '一版', show: 'verN' },
        { id: 'copies', label: '份數', kind: 'number', def: 'byVer' }
      ].concat(REPLY_FIELDS),
      showIf: function (p, key) { return key === 'reply' ? p.ver !== '第一版' : true; },
      build: function (p) {
        var S = (p.plan || '○○施工計畫') + verSuffix(p.ver);
        var items = (p.ver !== '第一版' ? [replyLine(p)] : []).concat([CONTRACT, '檢送' + S + '一式' + zhNum(p.copies) + '份。']);
        return { subject: head(p.code) + ' 之' + S + '，惠請 鑒核。', items: items, title: S };
      }
    },
    drawing: {
      name: 'D. 施工圖說送審',
      code: CODE_MAIN,
      fields: [
        { id: 'dwg', label: '圖說名稱', kind: 'text', def: '', ph: '例：雨水滯洪池施工軀體圖' },
        { id: 'ver', label: '版次', kind: 'select', options: VERS_SUBMIT, def: '第一版' },
        { id: 'verN', label: '第幾版', kind: 'select', options: VERS_N, def: '一版', show: 'verN' },
        { id: 'copies', label: '份數', kind: 'number', def: 'byVer' },
        { id: 'ref', label: '依據字號（修正版填來文備忘錄字號；審定版填審定函字號）', kind: 'text', def: '', ph: '例：森(工)字第1150821003號', show: 'ref' }
      ],
      showIf: function (p, key) { return key === 'ref' ? p.ver !== '第一版' : true; },
      build: function (p) {

        var first = p.ver === '第一版' ? '依施工圖送審管制表提送。'

      fields: [

        { id: 'ver', label: '版次', kind: 'select', options: VERS_SUBMIT, def: '第一版' },
        { id: 'verN', label: '第幾版', kind: 'select', options: VERS_N, def: '一版', show: 'verN' },
        { id: 'copies', label: '光碟份數', kind: 'number', def: 'byVer' },
        { id: 'ref', label: '依據字號（修正版填來文字號；審定版填審定函字號）', kind: 'text', def: '', ph: '例：森(工)字第1150622003號', show: 'notFirst' },
        { id: 'scope', label: '送審內容（說明一：依…內容辦理＿＿送審）', kind: 'text', def: '', ph: '例：地下筏基層模型', show: 'first' },
        { id: 'upload', label: '上傳內容（說明二：＿＿上傳於ACC平台）', kind: 'text', def: '', ph: '例：筏基模型及衝突報告' }
      ],
      showIf: function (p, key) { return key === 'first' ? p.ver === '第一版' : key === 'notFirst' ? p.ver !== '第一版' : true; },

        var first = p.ver === '第一版' ? '依' + MODEL_BASIS + '內容辦理' + (p.scope || name.replace(/^BIM/, '')) + '送審。'
          : isFinal(p.ver) ? '依' + ref + '辦理' + p.ver + '。' : '覆' + ref + '內容修正。';

                 items: [first, (p.upload || '○○模型及衝突報告') + '上傳於ACC平台，並提送光碟一式' + zhNum(p.copies) + '份。'],

      name: '其他（自由填寫）',

    var b = TYPES[k].build;
    TYPES[k].build = function (p) { var q = {}; for (var x in p) q[x] = p[x]; q.ver = fullVer(p); return b(q); };
  });
  function copiesFor(ver) { return /^審定/.test(ver || '') ? 3 : 1; }

  function docNo(date, seq) {
    return 'UN023–備' + date.y + pad2(date.m) + pad2(date.d) + pad2(seq || 1) + '號';
  }
  function rocDate(d) { return d.y + '年' + int(d.m) + '月' + int(d.d) + '日'; }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* items 文字（一行一項，"-" 開頭為子項）→ [{lvl, text}] */
  function parseItems(text) {
    return String(text || '').split('\n').map(function (s) { return s.replace(/\s+$/, ''); })
      .filter(function (s) { return s.trim(); })
      .map(function (s) {
        var m = s.match(/^\s*[-－]\s*(.*)$/);
        return m ? { lvl: 1, text: m[1] } : { lvl: 0, text: s.trim() };
      });
  }

  /* 把欄位填進範本 document.xml */
  function fillXml(xml, protos, f) {
    var rep = {
      MAIN_TO: f.mainTo, CC_TO: f.ccTo, DATE: f.date, DOCNO: f.docNo,
      HANDLER: f.handler, SUBJECT: '主旨：' + f.subject
    };
    Object.keys(rep).forEach(function (k) { xml = xml.split('{{' + k + '}}').join(esc(rep[k] || '')); });
    var items = parseItems(f.items);
    for (var k = 0; k < protos.length; k++) {
      var mark = '{{ITEMS_' + k + '}}', i = xml.indexOf(mark);
      if (i < 0) continue;
      var s = Math.max(xml.lastIndexOf('<w:p ', i), xml.lastIndexOf('<w:p>', i));
      var e = xml.indexOf('</w:p>', i) + 6;
      var body = items.map(function (it) {
        return (it.lvl ? protos[k].l1 : protos[k].l0).split('{{TEXT}}').join(esc(it.text));
      }).join('');
      xml = xml.slice(0, s) + body + xml.slice(e);
    }
    return xml;
  }

  return { TYPES: TYPES, copiesFor: copiesFor, zhNum: zhNum, pad2: pad2, docNo: docNo, rocDate: rocDate,
           parseItems: parseItems, fillXml: fillXml, CODE_MAIN: CODE_MAIN, CODE_TEST: CODE_TEST };
})();

  }
  async function build(){
    var zip=await JSZip.loadAsync(templateZipBytes);
    var xml=await zip.file('word/document.xml').async('string');
    zip.file('word/document.xml', C.fillXml(xml, PROTOS, fields()));
    return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  }

  $('form').addEventListener('submit', async function(e){
    e.preventDefault();
    var st=$('status'), f=fields();
    if(!f.handler){ st.textContent='請選擇承辦人。'; $('handler').focus(); return; }
    if(!C.parseItems(f.items).length){ st.textContent='說明至少需要一項。'; $('items').focus(); return; }
    var name=$('fname').value.trim()||fileName(f); if(!/\.docx$/i.test(name)) name+='.docx';
    st.textContent='產生中…';
    try{
      var blob=await build();
      store.set('handler', f.handler);
      var downloadsNs=await getDownloads();
      if(downloadsNs){
        try{ await downloadsNs.save({filename:name, data:blob}); st.textContent='已下載：'+name; }
        catch(err){ st.textContent = err && err.code==='declined' ? '已取消下載。' : '無法下載（'+(err&&err.code||'錯誤')+'）。'; }
      } else {
        var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        st.textContent='已下載：'+name;
      }
    }catch(err){ st.textContent='產生失敗：'+(err&&err.message||err); }
  });

  /* ---- 承辦人清單 ---- */
  var people=store.get('people',null);
  if(!Array.isArray(people)||!people.length){ people=KNOWN.slice(); store.get('handlers',[]).forEach(function(n){ if(people.indexOf(n)<0) people.push(n); }); }
  function hMsg(t){ $('hMsg').textContent=t||''; }
  function fillHandlers(sel){
    var h=$('handler'), cur=sel!==undefined?sel:(h.value||store.get('handler',''));
    h.innerHTML=''; var o0=document.createElement('option'); o0.value=''; o0.textContent='請選擇承辦人'; h.appendChild(o0);
    people.forEach(function(n){ var o=document.createElement('option'); o.value=n; o.textContent=n; h.appendChild(o); });
    h.value=people.indexOf(cur)>=0?cur:'';
  }
  function savePeople(){ store.set('people',people); }
  function addPerson(){
    var v=$('hNew').value.trim(); if(!v){ $('hNew').focus(); return; }
    if(people.indexOf(v)<0){ people.push(v); savePeople(); hMsg('已新增「'+v+'」。'); } else hMsg('「'+v+'」已在清單中。');
    fillHandlers(v); store.set('handler',v); $('hAddRow').hidden=true; update();
  }
  $('hAdd').addEventListener('click',function(){ $('hAddRow').hidden=false; $('hNew').value=''; $('hNew').focus(); hMsg(''); });
  $('hCancel').addEventListener('click',function(){ $('hAddRow').hidden=true; });
  $('hSave').addEventListener('click',addPerson);
  $('hNew').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addPerson(); } });
  var hPending=null;
  $('hDel').addEventListener('click',function(){
    var v=$('handler').value;
    if(!v){ hMsg('請先選擇要移除的人員。'); return; }
    if(hPending!==v){ hPending=v; hMsg('再按一次「移除」即從清單刪除「'+v+'」。'); return; }
    hPending=null; people=people.filter(function(n){ return n!==v; }); savePeople(); fillHandlers(''); store.set('handler','');
    hMsg('已移除「'+v+'」。'); update();
  });
  $('handler').addEventListener('change',function(){ store.set('handler',$('handler').value); hPending=null; hMsg(''); update(); });

  var lastCode=$('code').value;
  $('code').addEventListener('input', function(){
    var c=$('code').value.trim();
    if(state.manual){ if(lastCode && c) $('subject').value=$('subject').value.split(lastCode).join(c); }
    else applyTemplate();
    lastCode=c; update();
  });
  ['subject','items'].forEach(function(id){ $(id).addEventListener('input', function(){ state.manual=true; $('editedBar').hidden=false; lastTitle=''; update(); }); });
  ['date','seq','handler'].forEach(function(id){ $(id).addEventListener('input', update); });
  $('fname').addEventListener('input', function(){ fnameTouched = !!$('fname').value; });


  /* ---- 正本／副本單位清單 ---- */
  var DEFAULT_UNITS=['劉培森建築師事務所','內政部國土管理署北區都市基礎工程分署第八工務所'];
  var units=store.get('units',null); if(!Array.isArray(units)||!units.length) units=DEFAULT_UNITS.slice();
  function msg(t){ $('unitMsg').textContent=t||''; }
  function renderUnits(){
    ['mainTo','ccTo'].forEach(function(k,i){
      var sel=$(k), cur=sel.value || store.get('sel_'+k, k==='mainTo'?DEFAULT_UNITS[0]:DEFAULT_UNITS[1]);
      sel.innerHTML='';
      if(k==='ccTo'){ var o0=document.createElement('option'); o0.value=''; o0.textContent='（無）'; sel.appendChild(o0); }
      units.forEach(function(u){ var o=document.createElement('option'); o.value=u; o.textContent=u; sel.appendChild(o); });
      sel.value = units.indexOf(cur)>=0 || (k==='ccTo'&&cur==='') ? cur : (k==='mainTo'?units[0]:'');
    });
  }
  function saveUnits(){ store.set('units',units); }
  document.querySelectorAll('[data-add]').forEach(function(b){ b.addEventListener('click',function(){
    var k=b.dataset.add; $('add_'+k).hidden=false; $('new_'+k).value=''; $('new_'+k).focus(); msg(''); }); });
  document.querySelectorAll('[data-cancel]').forEach(function(b){ b.addEventListener('click',function(){ $('add_'+b.dataset.cancel).hidden=true; }); });
  function addUnit(k){
    var v=$('new_'+k).value.trim(); if(!v){ $('new_'+k).focus(); return; }
    if(units.indexOf(v)<0){ units.push(v); saveUnits(); msg('已新增「'+v+'」，正本與副本都可選用。'); }
    else msg('「'+v+'」已在清單中。');
    renderUnits(); $(k).value=v; store.set('sel_'+k,v); $('add_'+k).hidden=true; update();
  }
  document.querySelectorAll('[data-save]').forEach(function(b){ b.addEventListener('click',function(){ addUnit(b.dataset.save); }); });
  ['mainTo','ccTo'].forEach(function(k){
    $('new_'+k).addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addUnit(k); } });
    $(k).addEventListener('change',function(){ store.set('sel_'+k,$(k).value); update(); });
  });
  var pendingDel=null;
  document.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click',function(){
    var k=b.dataset.del, v=$(k).value;
    if(!v){ msg('目前選的是「（無）」，沒有可移除的單位。'); return; }
    if(units.length<=1){ msg('至少要保留一個單位。'); return; }
    if(pendingDel!==v){ pendingDel=v; msg('再按一次「移除」即從清單刪除「'+v+'」。'); return; }
    pendingDel=null; units=units.filter(function(u){ return u!==v; }); saveUnits(); renderUnits();
    store.set('sel_mainTo',$('mainTo').value); store.set('sel_ccTo',$('ccTo').value);
    msg('已移除「'+v+'」。'); update();
  }); });
  renderUnits();

  /* ---- 提送類別 ---- */
  var T=C.TYPES, state={ type: store.get('type','monitor'), manual:false, params:{} }, lastTitle='';
  if(!T[state.type]) state.type='monitor';
  function lastTuesday(){ var d=new Date(today); d.setDate(d.getDate()-((d.getDay()+5)%7||7)); return iso(d); }
  function prevMonth(){ var d=new Date(today.getFullYear(), today.getMonth()-1, 1); return d.getFullYear()+'-'+C.pad2(d.getMonth()+1); }
  Object.keys(T).forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=T[k].name; $('cat').appendChild(o); });
  $('cat').addEventListener('change', function(){ setType($('cat').value); });

  function defaultFor(f, raw){
    if (f.def==='lastTuesday' || (f.kind==='rocdate' && f.id==='rdate')) return lastTuesday();
    if (f.kind==='rocdate') return iso(today);
    if (f.kind==='rocmonth') return prevMonth();
    if (f.def==='byVer') return (T[state.type].copiesFor||C.copiesFor)(raw && raw.ver);
    return f.def;
  }
  function optionsFor(f){
    var o=f.options.slice();
    if(f.id==='rUnit') units.forEach(function(u){ if(o.indexOf(u)<0) o.push(u); });
    return o;
  }
  function renderParams(){
    var box=$('params'); box.innerHTML='';
    var fs=T[state.type].fields, replyShown=false;
    $('paramsSet').hidden=!fs.length;
    fs.forEach(function(f){
      if(f.show==='reply' && !replyShown){ replyShown=true; var h=el('div','sub','回覆來文（說明第一項「復 …辦理。」）'); h.dataset.show='reply'; box.appendChild(h); }
      var lab=document.createElement('label'), inp;
      if(f.kind==='seg'){
        var wrap=el('div','segWrap wide'), cur=state.params[f.id]!==undefined?state.params[f.id]:f.def;
        wrap.appendChild(el('span','segLabel',f.label));
        var grp=el('div','seg'); grp.setAttribute('role','group'); grp.setAttribute('aria-label',f.label);
        var hid=document.createElement('input'); hid.type='hidden'; hid.id='p_'+f.id; hid.value=cur;
        f.options.forEach(function(v){
          var bt=el('button','',v); bt.type='button'; bt.setAttribute('aria-pressed', v===cur?'true':'false');
          bt.addEventListener('click',function(){
            hid.value=v; [].forEach.call(grp.children,function(x){ x.setAttribute('aria-pressed', x===bt?'true':'false'); });
            readParams(); if(!state.manual) applyTemplate(); update();
          });
          grp.appendChild(bt);
        });
        wrap.appendChild(grp); wrap.appendChild(hid); box.appendChild(wrap); return;
      }
      if(f.kind==='select'){ inp=document.createElement('select'); optionsFor(f).forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; inp.appendChild(o); }); }
      else inp=document.createElement('input');
      inp.id='p_'+f.id; if(f.ph) inp.placeholder=f.ph;
      if(f.kind==='rocdate') inp.type='date';
      else if(f.kind==='rocmonth') inp.type='month';
      else if(f.kind==='number'){ inp.type='number'; inp.min=1; inp.max=99; }
      else if(f.kind==='check'){ inp.type='checkbox'; lab.className='chk wide'; }
      if(['mat','vendor','plan','ref','rNo','dwg','mdl','scope','upload'].indexOf(f.id)>=0) lab.classList.add('wide');
      if(f.show) lab.dataset.show=f.show;
      var v=state.params[f.id]; if(v===undefined) v=defaultFor(f, state.params);
      if(f.kind==='check') inp.checked=!!v; else inp.value=v;
      if(f.kind==='check'){ lab.appendChild(inp); lab.appendChild(document.createTextNode(f.label)); }
      else { lab.appendChild(document.createTextNode(f.label)); lab.appendChild(inp); }
      var h=function(){
        if(f.id==='ver'){ var c=$('p_copies'); if(c) c.value=(T[state.type].copiesFor||C.copiesFor)(inp.value); }
        readParams(); if(!state.manual) applyTemplate(); update();
      };
      inp.addEventListener('input', h); if(f.kind==='check'||f.kind==='select') inp.addEventListener('change', h);
      box.appendChild(lab);
    });
    readParams();
  }
  function readParams(){
    state.params={};
    T[state.type].fields.forEach(function(f){ var e=$('p_'+f.id); if(e) state.params[f.id]= f.kind==='check'?e.checked:e.value; });
    var t=T[state.type];
    [].forEach.call($('params').children, function(n){ var k=n.dataset.show; n.hidden = !!(k && (k==='verN' ? !/^(增修|審定)$/.test(state.params.ver||'') : (t.showIf && !t.showIf(state.params,k)))); });
  }
  function builtParams(){
    var p={code:$('code').value.trim()};
    T[state.type].fields.forEach(function(f){
      var v=state.params[f.id];
      if(f.kind==='rocdate'||f.kind==='rocmonth') v=toRoc(v)||toRoc(defaultFor(f));
      if(f.kind==='number') v=parseInt(v,10)||1;
      p[f.id]=v;
    });
    return p;
  }
  function applyTemplate(){
    var r=T[state.type].build(builtParams());
    $('subject').value=r.subject; $('items').value=r.items.join('\n'); lastTitle=r.title;
    state.manual=false; $('editedBar').hidden=true;
  }
  function setType(k){
    state.type=k; store.set('type',k); state.params={}; $('cat').value=k;
    $('code').value=T[k].code; lastCode=$('code').value;
    renderParams(); applyTemplate(); update();
  }
  $('regen').addEventListener('click', function(){ applyTemplate(); update(); });
  $('date').value=iso(today);
  fillHandlers(); setType(state.type);
})();
</script>

</body>
</html>
